name: slack-discovery-idempotency

on:
  push:
    paths:
      - "infra/slack/**"
      - "common/**"
      - "pyproject.toml"
      - ".github/workflows/slack-discovery-idempotency.yml"
  pull_request:
    paths:
      - "infra/slack/**"
      - "common/**"
      - "pyproject.toml"
      - ".github/workflows/slack-discovery-idempotency.yml"

jobs:
  slack-discovery-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Config-layer deps only (no heavy ML stack): the discovery import
          # chain loads common.config → pydantic-settings → python-dotenv.
          # Keeps this smoke fast while letting infra.slack.discovery import.
          pip install pytest requests pydantic pydantic-settings python-dotenv

      - name: Run discovery idempotency smoke test
        run: |
          pytest -q infra/slack/tests/test_discovery_idempotency_ci.py
