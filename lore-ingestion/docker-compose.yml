services:

  # ── Neo4j (Gmail knowledge graph + lore-backend GraphRAG) ───────────
  neo4j:
    image: neo4j:5.26-community
    container_name: lore-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser  → http://localhost:7474
      - "7687:7687"   # Bolt protocol  → bolt://localhost:7687
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-lorepassword}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── PostgreSQL 16 + pgvector (Chronograph code store) ────────────────
  # IMAGE: pgvector/pgvector:pg16 (multi-arch; ships pgvector). Exposed on host
  # port 5434 as `lore-chronograph-postgres` to avoid colliding with :5432.
  postgres:
    # Was a custom build (postgis/postgis:16-3.5 + pgvector), but that base
    # image has no arm64 variant. pgvector/pgvector:pg16 is multi-arch and
    # ships pgvector; PostGIS was "future use" only (see init.sql).
    image: pgvector/pgvector:pg16
    container_name: lore-chronograph-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lorepassword}"
      POSTGRES_DB: lore_chronograph
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore_chronograph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Chronograph code-intel poller ────────────────────────────────────
  # Runs the scheduled GitLab + GitHub polling loop.
  # Set the source env vars in .env (or docker-compose.override.yml).
  # Scale to 0 replicas if you don't use code-intelligence.
  chronograph-poller:
    build:
      context: .
      dockerfile: Dockerfile
    image: loremind/lore-ingestion:latest
    container_name: lore-chronograph-poller
    restart: unless-stopped
    command: python -m runners.chronograph_poller
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Store backend
      CHRONOGRAPH_STORE: postgres
      DATABASE_URL: "postgresql://lore:${POSTGRES_PASSWORD:-lorepassword}@postgres:5432/lore_chronograph"
      # GitLab
      GITLAB_PAT: "${GITLAB_PAT:-}"
      GITLAB_BASE_URL: "${GITLAB_BASE_URL:-https://gitlab.com}"
      GITLAB_PROJECTS: "${GITLAB_PROJECTS:-}"
      GITLAB_POLL_INTERVAL_SECONDS: "${GITLAB_POLL_INTERVAL_SECONDS:-10800}"
      # GitHub
      GITHUB_PAT: "${GITHUB_PAT:-}"
      GITHUB_REPOS: "${GITHUB_REPOS:-}"
      GITHUB_POLL_INTERVAL_SECONDS: "${GITHUB_POLL_INTERVAL_SECONDS:-10800}"
      # Embeddings
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # State / checkpoints
      LORE_STATE_DIR: /app/state
    volumes:
      - lore_state:/app/state
    profiles:
      - chronograph   # opt-in: docker compose --profile chronograph up

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  lore_state:
