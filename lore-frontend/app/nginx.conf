server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend (avoids CORS)
    location /api/ {
        proxy_pass https://lore-ezobooks.blackpond-477b24bf.southeastasia.azurecontainerapps.io/api/;
        proxy_http_version 1.1;
        proxy_set_header Host lore-ezobooks.blackpond-477b24bf.southeastasia.azurecontainerapps.io;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # SPA routing  send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable caching for index.html itself
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
