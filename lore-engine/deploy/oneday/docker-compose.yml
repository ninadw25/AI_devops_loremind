# One-day course demo stack: the same services as the local demo, behind Caddy (HTTPS + password).
# Started by cloud-init on the EC2 instance (see main.tf / user_data.sh.tftpl). Nothing here is
# reachable from outside except Caddy on 80/443.
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    volumes: ["./neo4j-data:/data"]          # restored from the local graph (auth is inside the data)
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: lore, POSTGRES_PASSWORD: "${PG_PASSWORD}", POSTGRES_DB: lore_memory}
    volumes: ["pg-data:/var/lib/postgresql/data", "./pg-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lore -d lore_memory"], interval: 5s, retries: 30}
    restart: unless-stopped

  engine:
    build: ./src
    env_file: engine.env
    depends_on: {postgres: {condition: service_healthy}, neo4j: {condition: service_started}}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    env_file: caddy.env
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./ui:/srv/ui:ro", "caddy-data:/data"]
    depends_on: [engine]
    restart: unless-stopped

volumes: {pg-data: {}, caddy-data: {}}
