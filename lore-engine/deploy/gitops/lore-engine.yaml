{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "lore-engine",
    "labels": {
      "app.kubernetes.io/name": "lore-engine"
    }
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "lore-engine"
      }
    },
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxSurge": 1,
        "maxUnavailable": 0
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "lore-engine"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "<AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/loremind/lore-engine:bb6010d3",
            "ports": [
              {
                "name": "http",
                "containerPort": 8000
              }
            ],
            "env": [
              {
                "name": "PORT",
                "value": "8000"
              },
              {
                "name": "ENVIRONMENT",
                "value": "production"
              },
              {
                "name": "LLM_PROVIDER",
                "value": "bedrock"
              },
              {
                "name": "LLM_MODEL",
                "value": "apac.anthropic.claude-3-5-sonnet-20241022-v2:0"
              },
              {
                "name": "BEDROCK_REGION",
                "value": "ap-south-1"
              },
              {
                "name": "LLM_MAX_TOKENS",
                "value": "4096"
              },
              {
                "name": "LLM_TEMPERATURE",
                "value": "0.3"
              },
              {
                "name": "EMBEDDING_PROVIDER",
                "value": "nvidia"
              },
              {
                "name": "EMBEDDING_MODEL",
                "value": "nvidia/nemotron-3-embed-1b"
              },
              {
                "name": "EMBEDDING_DIM",
                "value": "2048"
              },
              {
                "name": "NEO4J_URI",
                "value": "bolt://10.0.1.65:7687"
              },
              {
                "name": "NEO4J_USERNAME",
                "value": "neo4j"
              },
              {
                "name": "TENANT_ROUTING_ENABLED",
                "value": "false"
              },
              {
                "name": "RBAC_URL",
                "value": "http://auth-service:3000"
              },
              {
                "name": "RERANK_PROVIDER",
                "value": "flashrank"
              }
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "lore-engine-env"
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "1",
                "memory": "2Gi"
              },
              "limits": {
                "memory": "2Gi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "http"
              },
              "periodSeconds": 10,
              "initialDelaySeconds": 20
            },
            "livenessProbe": {
              "tcpSocket": {
                "port": "http"
              },
              "initialDelaySeconds": 90,
              "periodSeconds": 30
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "lore-engine",
    "labels": {
      "app.kubernetes.io/name": "lore-engine"
    }
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/name": "lore-engine"
    },
    "ports": [
      {
        "name": "http",
        "port": 8000,
        "targetPort": "http"
      }
    ]
  }
}
---
{
  "apiVersion": "external-secrets.io/v1",
  "kind": "ExternalSecret",
  "metadata": {
    "name": "lore-engine-env"
  },
  "spec": {
    "refreshInterval": "1h",
    "secretStoreRef": {
      "name": "aws-parameter-store",
      "kind": "ClusterSecretStore"
    },
    "target": {
      "name": "lore-engine-env",
      "creationPolicy": "Owner"
    },
    "data": [
      {
        "secretKey": "NEO4J_PASSWORD",
        "remoteRef": {
          "key": "/loremind/lore-engine/NEO4J_PASSWORD"
        }
      },
      {
        "secretKey": "NVIDIA_API_KEY",
        "remoteRef": {
          "key": "/loremind/lore-engine/NVIDIA_API_KEY"
        }
      },
      {
        "secretKey": "BEDROCK_API_KEY",
        "remoteRef": {
          "key": "/loremind/lore-engine/BEDROCK_API_KEY"
        }
      },
      {
        "secretKey": "INTERNAL_AUTH_SECRET",
        "remoteRef": {
          "key": "/loremind/lore-engine/INTERNAL_AUTH_SECRET"
        }
      },
      {
        "secretKey": "RBAC_INTERNAL_SECRET",
        "remoteRef": {
          "key": "/loremind/lore-engine/RBAC_INTERNAL_SECRET"
        }
      },
      {
        "secretKey": "MEMORY_POSTGRES_URI",
        "remoteRef": {
          "key": "/loremind/lore-engine/MEMORY_POSTGRES_URI"
        }
      }
    ]
  }
}
