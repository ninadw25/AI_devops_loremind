services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore_secret
      POSTGRES_DB: lore_memory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
